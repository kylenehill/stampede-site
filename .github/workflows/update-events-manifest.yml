name: Update Image Manifests

on:
  push:
    paths:
      - 'images/events/**'
      - 'images/slider/**'

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifests
        run: |
          # Build each manifest as a JSON list of the folder's .webp files.
          # Python handles file names with spaces or special characters.
          for folder in images/events images/slider; do
            python3 - "$folder" <<'PY'
          import json, os, sys
          folder = sys.argv[1]
          files = sorted(f for f in os.listdir(folder) if f.lower().endswith('.webp'))
          with open(os.path.join(folder, 'manifest.json'), 'w') as fh:
              json.dump(files, fh, indent=2)
              fh.write('\n')
          PY
            echo "Updated $folder/manifest.json"
          done

      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/events/manifest.json images/slider/manifest.json
          git diff --staged --quiet || git commit -m "chore: update image manifests"
          git push
