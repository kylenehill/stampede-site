name: Update Image Manifests

on:
  push:
    paths:
      - 'images/events/**'
      - 'images/slider/**'

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifests
        run: |
          for folder in images/events images/slider; do
            files=$(ls "$folder"/*.webp 2>/dev/null | xargs -I{} basename {} | sort)
            echo "[" > "$folder/manifest.json"
            first=true
            for f in $files; do
              [ "$first" = true ] || echo "," >> "$folder/manifest.json"
              printf '  "%s"' "$f" >> "$folder/manifest.json"
              first=false
            done
            echo "" >> "$folder/manifest.json"
            echo "]" >> "$folder/manifest.json"
            echo "Updated $folder/manifest.json"
          done

      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/events/manifest.json images/slider/manifest.json
          git diff --staged --quiet || git commit -m "chore: update image manifests"
          git push
